{% extends "base.html" %}

{% block title %}Usuarios - Admin{% endblock %}

{% block content %}
<div class="mt-5">
    <h1 class="d-flex justify-content-center">Listado de usuarios</h1>
    <div class="d-flex justify-content-end">
        <a href="/admin/user/new">
            <button class="btn btn-success">Crear usuario</button>
        </a>
    </div>
    <table class="table table-dark table-striped mt-2">
        <thead>
            <tr>
                <th>ID</th>
                <th>NICK</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.nick }}</td>
                
                <td>
                    <div class="d-flex justify-content-end">
                        <a href="/admin/user/{{ user.id }}/edit" class="px-2">
                            <button class="btn btn-warning mt-2">Editar</button>
                        </a>
                        <form method="post" action="/admin/user/{{ user.id }}/delete" style="display: inline" onsubmit="return confirm('¿Estás seguro que quieres eliminar este videojuego?');">   
                            <button type="submit" class="btn btn-danger mt-2 me-3">Eliminar</button>
                        </form>
                    </div>
                </td>
            </tr>
            {% endfor %}
            
        </tbody>
    </table>
</div>
{% endblock %}
